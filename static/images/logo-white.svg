<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 250 50" width="250" height="50">
  <defs>
    <!-- Background Gradient: Deep Mocha to Velvet Espresso -->
    <linearGradient id="crestBgWhite" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2D170C" />
      <stop offset="50%" stop-color="#462515" />
      <stop offset="100%" stop-color="#61341E" />
    </linearGradient>

    <!-- Radiant Bronze Gold Gradient -->
    <linearGradient id="bronzeGoldWhite" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FCE1BE" />
      <stop offset="30%" stop-color="#E2A662" />
      <stop offset="70%" stop-color="#C27530" />
      <stop offset="100%" stop-color="#8C4412" />
    </linearGradient>

    <!-- Warm White Gradient for Pillars -->
    <linearGradient id="pillarWhiteGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#F5E8DC" />
    </linearGradient>

    <!-- Soft Ambient Shadow -->
    <filter id="badgeShadowWhite" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="2" stdDeviation="2.5" flood-color="#000000" flood-opacity="0.45"/>
    </filter>
  </defs>

  <!-- Bespoke YH Monogram Emblem -->
  <g transform="translate(6, 4)" filter="url(#badgeShadowWhite)">
    <!-- Base Squircle -->
    <rect x="0" y="0" width="42" height="42" rx="13" fill="url(#crestBgWhite)" />
    <!-- Fine Metallic Inset Border -->
    <rect x="1" y="1" width="40" height="40" rx="12" fill="none" stroke="url(#bronzeGoldWhite)" stroke-width="1.3" stroke-opacity="0.8" />

    <!-- Left Pillar of 'H' -->
    <rect x="8.5" y="10" width="5.5" height="22" rx="2.75" fill="url(#pillarWhiteGrad)" />

    <!-- Right Pillar of 'H' -->
    <rect x="28" y="10" width="5.5" height="22" rx="2.75" fill="url(#pillarWhiteGrad)" />

    <!-- Dynamic 'Y' Monogram: Rises from bottom, bridges 'H' at center, and ascends into wings -->
    <path d="M19.5 32 L22.5 32 L22.5 22.5 L29.5 13.5 L26 11 L21 17.8 L16 11 L12.5 13.5 L19.5 22.5 Z" fill="url(#bronzeGoldWhite)" />

    <!-- Upward Apex Spark (Opportunity Star) -->
    <polygon points="21,7.5 23.5,11.5 21,10.5 18.5,11.5" fill="#FFF7ED" />
  </g>

  <!-- Pure Typography: CAREERHUB in crisp white + warm bronze gold for dark footer -->
  <g transform="translate(58, 9)">
    <text x="0" y="21" font-family="'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="22.5" font-weight="900" letter-spacing="-0.4px">
      <tspan fill="#FFFFFF">CAREER</tspan><tspan fill="#E2A662">HUB</tspan>
    </text>
    <text x="1.5" y="32.5" font-family="'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="7.5" font-weight="700" fill="#D3C9C2" letter-spacing="1.8px">
      CONNECT • GROW • SUCCEED
    </text>
  </g>
</svg>
