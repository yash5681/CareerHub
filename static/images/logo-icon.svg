<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <!-- Background Badge Gradient -->
    <linearGradient id="yhIconGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#361F13" />
      <stop offset="50%" stop-color="#4A2E1F" />
      <stop offset="100%" stop-color="#6A3B22" />
    </linearGradient>

    <!-- Metallic Bronze Gradient -->
    <linearGradient id="yhIconBronze" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F5C58E" />
      <stop offset="35%" stop-color="#DDA15E" />
      <stop offset="70%" stop-color="#BC6C25" />
      <stop offset="100%" stop-color="#8A4814" />
    </linearGradient>

    <!-- Crisp White Gradient -->
    <linearGradient id="yhIconWhite" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#F6EDE6" />
    </linearGradient>

    <!-- Drop Shadow -->
    <filter id="yhShadow" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="2.5" stdDeviation="2.5" flood-color="#1E0E06" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Base Icon Squircle -->
  <rect x="2" y="2" width="60" height="60" rx="16" fill="url(#yhIconGrad)" filter="url(#yhShadow)" />
  <rect x="3.5" y="3.5" width="57" height="57" rx="14.5" fill="none" stroke="url(#yhIconBronze)" stroke-width="1.8" stroke-opacity="0.8" />

  <!-- 'H' Structural Frame -->
  <!-- Left Pillar of H -->
  <rect x="14" y="14" width="8" height="36" rx="3.5" fill="url(#yhIconWhite)" />
  <!-- Right Pillar of H -->
  <rect x="42" y="14" width="8" height="36" rx="3.5" fill="url(#yhIconWhite)" />
  <!-- Horizontal Bridge of H -->
  <rect x="20" y="30" width="24" height="6" rx="2" fill="url(#yhIconWhite)" opacity="0.95" />

  <!-- 'Y' Dynamic Geometric Overlay -->
  <!-- Left Diagonal Arm of Y -->
  <path d="M17 15 L23 15 L32 31 L27.5 33.5 Z" fill="url(#yhIconBronze)" />
  <!-- Right Diagonal Arm of Y -->
  <path d="M47 15 L41 15 L32 31 L36.5 33.5 Z" fill="url(#yhIconBronze)" />
  <!-- Center Vertical Stem of Y -->
  <rect x="29" y="30" width="6" height="20" rx="3" fill="url(#yhIconBronze)" />

  <!-- Upward Career Apex Diamond -->
  <polygon points="32,13 36,19 32,17.5 28,19" fill="#FFF2E2" />
  <circle cx="32" cy="9.5" r="2" fill="#F5C58E" />
</svg>
