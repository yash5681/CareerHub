services:
  - type: web
    name: careerhub-yash
    runtime: python
    buildCommand: "./build.sh"
    startCommand: "gunicorn config.wsgi:application"
    plan: free
    envVars:
      - key: DJANGO_SETTINGS_MODULE
        value: config.settings.production
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: careerhub-db
          property: connectionString
      - key: ALLOWED_HOSTS
        value: ".onrender.com,localhost,127.0.0.1"
      - key: CSRF_TRUSTED_ORIGINS
        value: "https://*.onrender.com"
      - key: RAZORPAY_KEY_ID
        value: rzp_test_placeholder_key
      - key: RAZORPAY_KEY_SECRET
        value: rzp_test_placeholder_secret

databases:
  - name: careerhub-db
    plan: free
    databaseName: careerhub
    user: careerhub_admin
